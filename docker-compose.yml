version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golfday-web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=${SUPABASE_HOST};Database=postgres;Username=postgres;Password=${SUPABASE_PASSWORD};SSL Mode=Require;Trust Server Certificate=true
    volumes:
      - golfday-logs:/app/logs
    restart: unless-stopped
    networks:
      - golfday-net

volumes:
  golfday-logs:
    driver: local

networks:
  golfday-net:
    driver: bridge
